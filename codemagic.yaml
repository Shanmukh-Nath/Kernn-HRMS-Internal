workflows:
  build-macos-desktop-bridge:
    name: Build Kernn Sync Bridge (macOS Universal)
    max_build_duration: 30
    instance_type: mac_mini_m1
    working_directory: desktop-bridge
    environment:
      node: latest
    scripts:
      - name: Install Dependencies
        script: |
          npm ci || npm install
      - name: Build macOS Binaries (DMG & ZIP for Intel x64 & Apple Silicon arm64)
        script: |
          npm run build:mac
    artifacts:
      - desktop-bridge/dist/*.dmg
      - desktop-bridge/dist/*.zip
      - desktop-bridge/dist/*.blockmap
    publishing:
      email:
        recipients:
          - shanmukhnath07@gmail.com
        notify:
          success: true
          failure: true
